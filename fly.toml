app = "strava-goal-visualizer"
primary_region = "ams"

[build]

[env]
LOG_LEVEL = "INFO"

[[services]]
internal_port = 8501
protocol = "tcp"

  [[services.ports]]
  port = 80
  handlers = ["http"]

  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

[mounts]
  source = "data"
  destination = "/data"

[[services.tcp_checks]]
interval = "15s"
timeout = "2s"
grace_period = "30s"
