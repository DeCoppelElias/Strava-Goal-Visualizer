name: Scheduled Maintenance

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cleanup-inactive
        env:
          MAINTENANCE_BASE_URL: ${{ secrets.MAINTENANCE_BASE_URL }}
          MAINTENANCE_CRON_TOKEN: ${{ secrets.MAINTENANCE_CRON_TOKEN }}
        run: |
          BASE_URL="$(echo "${MAINTENANCE_BASE_URL}" | tr -d '[:space:]' | sed 's#/*$##')"
          if [ -z "${BASE_URL}" ]; then
            echo "MAINTENANCE_BASE_URL is empty"
            exit 1
          fi
          ENDPOINT="${BASE_URL}/"

          PRECHECK_CODE=$(curl -sS --location --max-time 60 \
            -o /tmp/maintenance_precheck_response.txt \
            -w "%{http_code}" \
            "${ENDPOINT}")
          if [ "${PRECHECK_CODE}" -ge 400 ]; then
            echo "Base URL precheck failed with HTTP ${PRECHECK_CODE}."
            echo "Set MAINTENANCE_BASE_URL to your app root only (example: https://strava-goal-visualizer.fly.dev)."
            cat /tmp/maintenance_precheck_response.txt
            exit 1
          fi

          HTTP_CODE=$(curl -sS --location --retry 4 --retry-delay 15 --max-time 300 \
            --get \
            --data-urlencode "maintenance_action=cleanup-inactive" \
            --data-urlencode "days=90" \
            --data-urlencode "maintenance_token=${MAINTENANCE_CRON_TOKEN}" \
            -o /tmp/maintenance_cleanup_inactive_response.txt \
            -w "%{http_code}" \
            "${ENDPOINT}")

          cat /tmp/maintenance_cleanup_inactive_response.txt
          if [ "${HTTP_CODE}" -ge 400 ]; then
            echo "cleanup-inactive request failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: Trigger cleanup-activities
        env:
          MAINTENANCE_BASE_URL: ${{ secrets.MAINTENANCE_BASE_URL }}
          MAINTENANCE_CRON_TOKEN: ${{ secrets.MAINTENANCE_CRON_TOKEN }}
        run: |
          BASE_URL="$(echo "${MAINTENANCE_BASE_URL}" | tr -d '[:space:]' | sed 's#/*$##')"
          if [ -z "${BASE_URL}" ]; then
            echo "MAINTENANCE_BASE_URL is empty"
            exit 1
          fi
          ENDPOINT="${BASE_URL}/"

          PRECHECK_CODE=$(curl -sS --location --max-time 60 \
            -o /tmp/maintenance_precheck_response.txt \
            -w "%{http_code}" \
            "${ENDPOINT}")
          if [ "${PRECHECK_CODE}" -ge 400 ]; then
            echo "Base URL precheck failed with HTTP ${PRECHECK_CODE}."
            echo "Set MAINTENANCE_BASE_URL to your app root only (example: https://strava-goal-visualizer.fly.dev)."
            cat /tmp/maintenance_precheck_response.txt
            exit 1
          fi

          HTTP_CODE=$(curl -sS --location --retry 4 --retry-delay 15 --max-time 300 \
            --get \
            --data-urlencode "maintenance_action=cleanup-activities" \
            --data-urlencode "years=3" \
            --data-urlencode "maintenance_token=${MAINTENANCE_CRON_TOKEN}" \
            -o /tmp/maintenance_cleanup_activities_response.txt \
            -w "%{http_code}" \
            "${ENDPOINT}")

          cat /tmp/maintenance_cleanup_activities_response.txt
          if [ "${HTTP_CODE}" -ge 400 ]; then
            echo "cleanup-activities request failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
